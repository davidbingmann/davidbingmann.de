
services:
  app:
    image: davidbingmann/davidbingmann-de:latest
    container_name: mywebsite_app
    restart: always
    environment:
      - ENV=production
    networks:
      - my_network

  caddy:
    image: caddy:latest
    container_name: mywebsite_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - my_network
      - studip_mcp_net
      - admin_net

  watchtower:
    # Pinned and excluded from self-updates, so a new image never arrives unreviewed.
    image: nickfedor/watchtower:1.24.0@sha256:e96976bcbeaf0a9adeddc9016a539c27a2245ef6bb7d3ca97ed106783350d387
    container_name: watchtower_new
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 300
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - my_network

  # MCP server for Notion agents. Its credentials come as secret files, never as
  # environment variables; it is reachable only through Caddy.
  studip_mcp:
    build: ../studip-sync
    container_name: studip_mcp
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      - MCP_PATH=/studip-mcp
      - MCP_ALLOWED_HOSTS=davidbingmann.de
      - STUDIP_USERNAME_FILE=/run/secrets/studip_username
      - STUDIP_PASSWORD_FILE=/run/secrets/studip_password
      - MCP_TOKEN_FILE=/run/secrets/studip_mcp_token
    secrets:
      - studip_username
      - studip_password
      - studip_mcp_token
    labels:
      # Locally built image; Watchtower cannot pull it and retries every 5 min.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - studip_mcp_net

  feedback:
    build: ./feedback-service
    container_name: semestral_feedback
    restart: unless-stopped
    env_file: .env
    labels:
      # Locally built image; Watchtower cannot pull it and retries every 5 min.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - my_network

  semestral_site:
    build: ../semestral-website
    container_name: semestral_site
    restart: unless-stopped
    labels:
      # Locally built image; Watchtower cannot pull it and retries every 5 min.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - my_network

  insights:
    build: ./insights-service
    container_name: mywebsite_insights
    restart: unless-stopped
    volumes:
      - insights_data:/data
    labels:
      # Locally built image; Watchtower cannot pull it and retries every 5 min.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - admin_net

  # Login in front of the admin panel: password, then a passkey or a one-time
  # code. Configuration in ./authelia; the user file, secrets and database live
  # outside the repo. The data directory is a host directory owned by uid 1000,
  # since a fresh named volume belongs to root and Authelia (running as 1000)
  # could not write its database there.
  auth:
    image: authelia/authelia:4.39.28
    container_name: mywebsite_auth
    restart: unless-stopped
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ${SECRETS_DIR:?set SECRETS_DIR in .env}/authelia/users.yml:/config/users.yml:ro
      - ${SECRETS_DIR:?set SECRETS_DIR in .env}/authelia/data:/data
    environment:
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/run/secrets/authelia_jwt_secret
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia_session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia_storage_key
    secrets:
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_key
    # Its log names the IP address of every failed sign-in. The privacy text
    # promises those are gone after 30 days, which only the database pruning
    # below guarantees, so the container log is switched off. To debug, set
    # the driver to json-file for a while; `docker ps` shows the health check.
    logging:
      driver: none
    labels:
      # Pinned: a new login service version must never arrive unreviewed.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - admin_net

  # Authelia keeps its records with IP addresses (sign-in attempts, one-time
  # codes, IP bans) forever; this deletes them after 30 days, as the privacy
  # text says.
  auth_log_prune:
    image: python:3.12-slim
    container_name: mywebsite_auth_log_prune
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    mem_limit: 64m
    command: ["python", "/app/prune_auth_log.py"]
    volumes:
      - ./authelia/prune_auth_log.py:/app/prune_auth_log.py:ro
      - ${SECRETS_DIR:?set SECRETS_DIR in .env}/authelia/data:/data
    depends_on:
      - auth
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Saves the admin panel's edits as commits to this repo. Its GitHub token can
  # change the live site, so it runs locked down: not as root, read-only, with
  # no capabilities.
  admin:
    build: ./admin-service
    container_name: mywebsite_admin
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    environment:
      - GITHUB_REPO=davidbingmann/davidbingmann.de
      - ALLOWED_ORIGIN=https://davidbingmann.de
      - GITHUB_TOKEN_FILE=/run/secrets/admin_github_token
    secrets:
      - admin_github_token
    labels:
      # Locally built image; Watchtower cannot pull it and retries every 5 min.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - admin_net

volumes:
  insights_data:
  caddy_data:
  caddy_config:

secrets:
  # SECRETS_DIR (set in .env on the server) lies outside every repo and web
  # root; the directory is mode 700, the files 600.
  studip_username:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/studip-mcp/studip_username
  studip_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/studip-mcp/studip_password
  studip_mcp_token:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/studip-mcp/mcp_token
  # Fine-grained token: this repo only, Contents read/write, Actions read.
  admin_github_token:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/admin/github_token
  # 64 random characters each, e.g. `openssl rand -hex 32`.
  authelia_jwt_secret:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/authelia/jwt_secret
  authelia_session_secret:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/authelia/session_secret
  authelia_storage_key:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/authelia/storage_key

networks:
  my_network:
    driver: bridge
  # Only Caddy and the MCP server: the other containers cannot reach it directly.
  studip_mcp_net:
    driver: bridge
  # Only Caddy and the admin panel's services (login, admin, statistics), so
  # no other container can reach the service that holds the GitHub token.
  admin_net:
    driver: bridge
